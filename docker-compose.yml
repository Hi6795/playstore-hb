services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: playstorehb
      POSTGRES_USER: playstorehb
      POSTGRES_PASSWORD: development-only
    volumes: ["postgres-data:/var/lib/postgresql/18/docker"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U playstorehb"], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: development, MINIO_ROOT_PASSWORD: development-only-change-me }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  catalog-api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://playstorehb:development-only@postgres:5432/playstorehb
      ADMIN_TOKENS_JSON: '{"development-admin-token":{"subject":"local-admin","role":"administrator"}}'
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy } }
  admin-web:
    build: { context: ., dockerfile: infra/docker/admin.Dockerfile }
    ports: ["5174:8080"]
    depends_on: [catalog-api]
volumes: { postgres-data: {}, minio-data: {} }
